<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎂 生日祝福墙</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* 语音播放按钮 */
    .audio-btn {
      display: inline-flex; align-items: center; gap: 4px;
      background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
      border-radius: 16px; padding: 2px 10px 2px 6px; cursor: pointer;
      color: inherit; font-size: 0.7em; margin-left: 8px;
      transition: all 0.2s; vertical-align: middle;
    }
    .audio-btn:hover { background: rgba(255,255,255,0.25); }
    .audio-btn .audio-icon { font-size: 1.2em; }
    .audio-btn.playing { background: rgba(255,107,107,0.3); border-color: rgba(255,107,107,0.5); }
    .audio-btn.playing .audio-icon { animation: speak 0.6s infinite alternate; }
    @keyframes speak {
      0% { transform: scale(1); }
      100% { transform: scale(1.3); }
    }
    /* 弹幕时间显示 */
    .danmaku-time {
      display: block;
      font-size: 0.6em;
      opacity: 0.5;
      margin-bottom: 2px;
    }
    /* MBTI 标签样式 */
    .mbti-tag {
      display: inline-flex; align-items: center;
      padding: 2px 8px; border-radius: 10px;
      font-size: 0.55em; font-weight: 700;
      margin-right: 6px; cursor: pointer;
      transition: transform 0.2s; vertical-align: middle;
      opacity: 0.9;
    }
    .mbti-tag:hover { transform: scale(1.15); opacity: 1; }
    .mbti-tag.INTJ, .mbti-tag.INTP, .mbti-tag.ENTJ, .mbti-tag.ENTP {
      background: rgba(155,89,182,0.85); color: #fff;
    }
    .mbti-tag.INFJ, .mbti-tag.INFP, .mbti-tag.ENFJ, .mbti-tag.ENFP {
      background: rgba(39,174,96,0.85); color: #fff;
    }
    .mbti-tag.ISTJ, .mbti-tag.ISFJ, .mbti-tag.ESTJ, .mbti-tag.ESFJ {
      background: rgba(52,152,219,0.85); color: #fff;
    }
    .mbti-tag.ISTP, .mbti-tag.ISFP, .mbti-tag.ESTP, .mbti-tag.ESFP {
      background: rgba(243,156,18,0.85); color: #fff;
    }
    /* MBTI 详情弹窗 */
    .mbti-detail-modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      display: none; align-items: center; justify-content: center;
      z-index: 300; padding: 20px;
    }
    .mbti-detail-modal.show { display: flex; }
    .mbti-detail-content {
      background: #fff; border-radius: 20px; padding: 24px;
      max-width: 360px; width: 100%; text-align: center;
      animation: pop-in 0.3s ease;
    }
    .mbti-detail-type { font-size: 2.5rem; font-weight: 800; margin-bottom: 6px; }
    .mbti-detail-name { font-size: 1.2rem; color: #555; margin-bottom: 10px; }
    .mbti-detail-desc { font-size: 0.95rem; color: #666; line-height: 1.6; margin-bottom: 16px; }
    .mbti-detail-link {
      display: inline-block;
      font-size: 0.85rem;
      color: #764ba2;
      text-decoration: none;
      margin-bottom: 12px;
      padding: 4px 12px;
      border-radius: 6px;
      background: rgba(118, 75, 162, 0.1);
      transition: all 0.2s;
    }
    .mbti-detail-link:hover { background: rgba(118, 75, 162, 0.2); }
    .mbti-detail-close { padding: 10px 24px; border: none; border-radius: 10px; background: #764ba2; color: #fff; cursor: pointer; font-size: 0.95rem; }

    /* 回应按钮 */
    .reaction-btn {
      display: inline-flex; align-items: center; gap: 2px;
      padding: 2px 10px; border-radius: 14px;
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.15);
      cursor: pointer; font-size: 0.85em; transition: all 0.2s;
      user-select: none;
    }
    .reaction-btn:hover { background: rgba(255,255,255,0.15); transform: scale(1.1); }
    .reaction-btn.reacted { background: rgba(255,107,107,0.2); border-color: rgba(255,107,107,0.5); }

    /* 统计卡片 */
    .stat-card {
      flex: 1; min-width: 80px; text-align: center;
      background: rgba(255,255,255,0.08); border-radius: 14px;
      padding: 14px 10px;
    }
    .stat-card .stat-num { font-size: 1.6rem; font-weight: 800; }
    .stat-card .stat-label { font-size: 0.7rem; color: rgba(255,255,255,0.55); margin-top: 4px; }
  </style>
</head>
<body>
  <!-- 背景层 -->
  <div id="bg-layer"></div>

  <!-- 标题区 -->
  <header id="header">
    <h1 id="title">🎂 生日快乐 🎂</h1>
    <p id="subtitle">扫码送出你的祝福</p>
    <div id="counter">
      <span class="counter-icon">💌</span>
      <span class="counter-text">已收到 <span id="count">0</span> 条祝福</span>
    </div>
    <button id="msgBoardBtn" style="
      margin-top: 12px; padding: 10px 24px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none; border-radius: 25px;
      color: #fff; font-size: 1rem; cursor: pointer;
      box-shadow: 0 4px 15px rgba(102,126,234,0.4);
      transition: all 0.3s;
    " onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
      📋 查看留言板
    </button>
    <button id="statsBtn" style="
      margin-top: 8px; padding: 8px 20px;
      background: linear-gradient(135deg, #f093fb, #f5576c);
      border: none; border-radius: 25px;
      color: #fff; font-size: 0.9rem; cursor: pointer;
      box-shadow: 0 4px 15px rgba(245,87,108,0.4);
      transition: all 0.3s;
    " onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
      📊 数据统计
    </button>
  </header>

  <!-- 弹幕层 -->
  <div id="danmaku-layer"></div>

  <!-- 二维码浮窗 -->
  <div id="qr-float" title="点击查看大图">
    <img id="qr-img" src="" alt="扫码送祝福">
    <span>扫码送祝福</span>
  </div>

  <!-- MBTI 详情弹窗 -->
  <div class="mbti-detail-modal" id="mbtiDetailModal">
    <div class="mbti-detail-content">
      <div class="mbti-detail-type" id="mbtiDetailType"></div>
      <div class="mbti-detail-desc" id="mbtiDetailDesc"></div>
      <a class="mbti-detail-link" id="mbtiDetailLink" href="#" target="_blank">🔗 了解详情 →</a>
      <button class="mbti-detail-close" id="mbtiDetailClose">知道了</button>
    </div>
  </div>

  <!-- 留言板弹窗 -->
  <div class="msg-board-modal" id="msgBoardModal" style="
    position: fixed; inset: 0; background: rgba(0,0,0,0.8);
    display: none; align-items: center; justify-content: center;
    z-index: 400; padding: 20px;
  ">
    <div style="
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      border-radius: 20px; padding: 24px;
      max-width: 600px; width: 100%; max-height: 80vh;
      overflow-y: auto; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    ">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h2 style="color: #fff; font-size: 1.5rem; margin: 0;">📋 留言板</h2>
        <button id="msgBoardClose" style="
          background: rgba(255,255,255,0.2); border: none;
          color: #fff; font-size: 1.5rem; cursor: pointer;
          padding: 8px 16px; border-radius: 10px;
        ">×</button>
      </div>
      <div style="margin-bottom: 12px;">
        <input id="msgSearch" type="text" placeholder="🔍 搜索名字或内容..." style="
          width: 100%; padding: 10px 16px;
          background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
          border-radius: 12px; color: #fff; font-size: 0.9rem;
          outline: none; box-sizing: border-box;
        " />
      </div>
      <div id="msgBoardList" style="
        display: flex; flex-direction: column; gap: 12px;
      "></div>
    </div>
  </div>

  <!-- 数据统计弹窗 -->
  <div id="statsModal" style="
    position: fixed; inset: 0; background: rgba(0,0,0,0.8);
    display: none; align-items: center; justify-content: center;
    z-index: 500; padding: 20px;
  ">
    <div style="
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      border-radius: 20px; padding: 24px;
      max-width: 600px; width: 100%; max-height: 85vh;
      overflow-y: auto; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      color: #fff;
    ">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="font-size: 1.5rem; margin: 0;">📊 数据统计</h2>
        <button id="statsClose" style="
          background: rgba(255,255,255,0.2); border: none;
          color: #fff; font-size: 1.5rem; cursor: pointer;
          padding: 8px 16px; border-radius: 10px;
        ">×</button>
      </div>
      <div id="statsSummary" style="display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap;"></div>
      <div style="margin-bottom: 20px;">
        <h3 style="font-size: 1.1rem; margin: 0 0 12px 0;">🧠 MBTI 人格分布</h3>
        <canvas id="mbtiPieChart" width="560" height="240" style="display: block; margin: 0 auto; max-width: 100%;"></canvas>
      </div>
      <div>
        <h3 style="font-size: 1.1rem; margin: 0 0 12px 0;">⏰ 祝福时间分布</h3>
        <canvas id="hourBarChart" width="560" height="220" style="display: block; margin: 0 auto; max-width: 100%;"></canvas>
      </div>
    </div>
  </div>

  <script>
    // ========== 配置 ==========
    const CONFIG = {
      title: '🎂 生日快乐 🎂',
      subtitle: '扫码送出你的祝福',
      bgImage: '/assets/birthday.png',
      maxDanmaku: 30,
      danmakuSpeed: { min: 8, max: 15 },
      danmakuFontSize: { min: 22, max: 40 },
      loopInterval: 3000,
    };

    const REACTION_EMOJIS = ['❤️', '👍', '😂', '🎉', '🙏'];

    // ========== 初始化 ==========
    document.getElementById('title').textContent = CONFIG.title;
    document.getElementById('subtitle').textContent = CONFIG.subtitle;
    if (CONFIG.bgImage) {
      document.getElementById('bg-layer').style.backgroundImage = `url(${CONFIG.bgImage})`;
    }

    // ========== 用户 ID ==========
    function getOrGenerateUserId() {
      let uid = localStorage.getItem('birthday_userId');
      if (!uid) {
        uid = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
        localStorage.setItem('birthday_userId', uid);
      }
      return uid;
    }

    // ========== 音频播放管理 ==========
    let currentPlayingAudio = null;
    let currentPlayingBtn = null;

    function playAudio(audioUrl, btnElement) {
      if (currentPlayingBtn === btnElement && currentPlayingAudio && !currentPlayingAudio.paused) {
        currentPlayingAudio.pause();
        currentPlayingAudio.currentTime = 0;
        btnElement.classList.remove('playing');
        currentPlayingAudio = null;
        currentPlayingBtn = null;
        return;
      }
      if (currentPlayingAudio) {
        currentPlayingAudio.pause();
        currentPlayingAudio.currentTime = 0;
        if (currentPlayingBtn) currentPlayingBtn.classList.remove('playing');
      }
      const audio = new Audio(audioUrl);
      currentPlayingAudio = audio;
      currentPlayingBtn = btnElement;
      btnElement.classList.add('playing');
      audio.play().catch(err => {
        console.error('播放失败:', err);
        btnElement.classList.remove('playing');
      });
      audio.onended = () => {
        btnElement.classList.remove('playing');
        currentPlayingAudio = null;
        currentPlayingBtn = null;
      };
      audio.onerror = () => {
        btnElement.classList.remove('playing');
        currentPlayingAudio = null;
        currentPlayingBtn = null;
      };
    }

    // ========== WebSocket ==========
    let ws;
    function connectWS() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${location.host}`);
      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === 'new_blessing') {
          blessingCount++;
          updateCounter();
          blessingPool.push(msg.data);
          addDanmaku(msg.data);
          if (msgBoardModal.style.display === 'flex') renderMsgBoard();
        } else if (msg.type === 'delete_blessing') {
          const id = msg.id;
          const idx = blessingPool.findIndex(b => b.id === id);
          if (idx > -1) blessingPool.splice(idx, 1);
          blessingCount = Math.max(0, blessingCount - 1);
          updateCounter();
          document.querySelectorAll('.danmaku-item[data-id="' + id + '"]').forEach(el => el.remove());
          if (msgBoardModal.style.display === 'flex') renderMsgBoard();
        } else if (msg.type === 'update_reaction') {
          const b = blessingPool.find(b => b.id === msg.id);
          if (b) {
            b.reactions = msg.reactions;
            if (msgBoardModal.style.display === 'flex') renderMsgBoard();
          }
        }
      };
      ws.onclose = () => setTimeout(connectWS, 2000);
    }
    connectWS();

    // ========== 计数器 ==========
    let blessingCount = 0;
    const countEl = document.getElementById('count');

    function updateCounter() {
      countEl.textContent = blessingCount;
      countEl.parentElement.parentElement.classList.add('counter-bump');
      setTimeout(() => countEl.parentElement.parentElement.classList.remove('counter-bump'), 400);
    }

    // ========== 弹幕 ==========
    const danmakuLayer = document.getElementById('danmaku-layer');
    let danmakuCount = 0;
    const blessingPool = [];

    function addDanmaku(b) {
      if (danmakuCount >= CONFIG.maxDanmaku) return;
      danmakuCount++;

      const el = document.createElement('div');
      el.className = 'danmaku-item';
      el.dataset.id = b.id;

      if (b.time) {
        const timeSpan = document.createElement('span');
        timeSpan.className = 'danmaku-time';
        timeSpan.textContent = formatTime(b.time);
        el.appendChild(timeSpan);
      }

      const emojiPrefix = b.emoji ? b.emoji + ' ' : '';

      const textSpan = document.createElement('span');
      if (b.mbti_type) {
        const mbtiTag = document.createElement('span');
        mbtiTag.className = 'mbti-tag ' + b.mbti_type;
        mbtiTag.textContent = MBTI_DATA[b.mbti_type]?.name || b.mbti_type;
        el.appendChild(mbtiTag);
        el.style.cursor = 'pointer';
        el.addEventListener('click', () => showMbtiDetail(b.mbti_type));
      }
      textSpan.textContent = `${emojiPrefix}${b.name}: ${b.message}`;
      el.appendChild(textSpan);

      if (b.audio) {
        const audioBtn = document.createElement('span');
        audioBtn.className = 'audio-btn';
        audioBtn.innerHTML = '<span class="audio-icon">🎵</span>语音';
        audioBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          playAudio(b.audio, audioBtn);
        });
        audioBtn.addEventListener('mousedown', (e) => e.stopPropagation());
        audioBtn.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });
        el.appendChild(audioBtn);
      }

      const fontSize = randInt(CONFIG.danmakuFontSize.min, CONFIG.danmakuFontSize.max);
      const duration = randInt(CONFIG.danmakuSpeed.min, CONFIG.danmakuSpeed.max);
      const top = randInt(60, window.innerHeight - 80);

      el.style.cssText = `
        font-size: ${fontSize}px;
        color: ${b.color || '#fff'};
        top: ${top}px;
        animation-duration: ${duration}s;
        text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
        display: flex;
        align-items: center;
      `;

      danmakuLayer.appendChild(el);
      el.addEventListener('animationend', () => {
        el.remove();
        danmakuCount--;
      });
    }

    function startLoop() {
      setInterval(() => {
        if (blessingPool.length === 0) return;
        const b = blessingPool[Math.floor(Math.random() * blessingPool.length)];
        addDanmaku(b);
      }, CONFIG.loopInterval);
    }

    // ========== 加载历史祝福 ==========
    async function loadBlessings() {
      try {
        const res = await fetch('/api/blessings');
        const data = await res.json();
        blessingCount = data.length;
        updateCounter();
        data.forEach(b => {
          blessingPool.push(b);
          addDanmaku(b);
        });
        startLoop();
      } catch (e) {
        console.error('加载祝福失败:', e);
      }
    }

    // ========== 加载二维码 ==========
    async function loadQRCode() {
      try {
        const res = await fetch('/api/qrcode');
        const data = await res.json();
        document.getElementById('qr-img').src = data.qr;
      } catch (e) {
        console.error('加载二维码失败:', e);
      }
    }

    // ========== 工具函数 ==========
    function randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function formatTime(isoStr) {
      if (!isoStr) return '';
      const d = new Date(isoStr);
      const now = new Date();
      const h = d.getHours().toString().padStart(2, '0');
      const m = d.getMinutes().toString().padStart(2, '0');
      const isToday = d.toDateString() === now.toDateString();
      if (isToday) return h + ':' + m;
      const month = (d.getMonth() + 1).toString().padStart(2, '0');
      const day = d.getDate().toString().padStart(2, '0');
      return month + '/' + day + ' ' + h + ':' + m;
    }

    function escapeHtml(s) {
      const div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }

    // ========== MBTI 详情 ==========
    const MBTI_DATA = {
      INTJ: { name: '建筑师', desc: '富有想象力的战略家，一切皆在计划中。独立果断，对知识有强烈的渴望。' },
      INTP: { name: '逻辑学家', desc: '不知疲倦的思考者，对知识和理论有无穷的好奇心。追求逻辑自洽，喜欢探索抽象概念。' },
      ENTJ: { name: '指挥官', desc: '大胆果断的天生领袖，善于制定长远计划并推动团队执行。气场强大，目标明确。' },
      ENTP: { name: '辩论家', desc: '聪明好奇的思想实验者，热爱智力挑战和头脑风暴。思维敏捷，喜欢打破常规。' },
      INFJ: { name: '提倡者', desc: '安静而神秘的理想主义者，洞察力强，总是思考如何让世界更美好。' },
      INFP: { name: '调停者', desc: '诗意善良的利他主义者，内心丰富且充满理想。对世界有独特的理解和深沉的共情。' },
      ENFJ: { name: '主人公', desc: '富有魅力的激励者，天生的影响力让周围人愿意追随。善于鼓舞人心，推动改变。' },
      ENFP: { name: '竞选者', desc: '热情洋溢的自由精灵，永远充满创意和可能性。好奇心旺盛，感染力十足。' },
      ISTJ: { name: '物流师', desc: '务实可靠的秩序守护者，一丝不苟地履行职责。重视传统，值得信赖。' },
      ISFJ: { name: '守卫者', desc: '温暖体贴的保护者，默默守护身边的人。细心周到，是团队中不可或缺的支柱。' },
      ESTJ: { name: '总经理', desc: '高效务实的组织者，善于建立秩序和制度。做事有计划，执行力超强。' },
      ESFJ: { name: '执行者', desc: '热心肠的社交家，总是把别人的需求放在心上。善于营造温馨和谐的团队氛围。' },
      ISTP: { name: '鉴赏家', desc: '大胆实际的实验家，喜欢动手探索世界。冷静理性，擅长在紧急时刻解决问题。' },
      ISFP: { name: '探险家', desc: '灵活随性的艺术家，用行动和美感诠释世界。内心丰富但低调，活在当下。' },
      ESTP: { name: '企业家', desc: '活力满满的机会主义者，享受冒险和即兴发挥。反应极快，永远走在最前沿。' },
      ESFP: { name: '表演者', desc: '自发的娱乐家，天生自带光环。热情洋溢，走到哪里都是派对的中心。' },
    };

    const MBTI_TYPE_COLORS = {
      INTJ: '#9b59b6', INTP: '#8e44ad', ENTJ: '#a569bd', ENTP: '#bb8fce',
      INFJ: '#27ae60', INFP: '#2ecc71', ENFJ: '#58d68d', ENFP: '#82e0aa',
      ISTJ: '#3498db', ISFJ: '#5dade2', ESTJ: '#85c1e9', ESFJ: '#aed6f1',
      ISTP: '#f39c12', ISFP: '#f5b041', ESTP: '#f8c471', ESFP: '#fad7a0',
    };

    const mbtiDetailModal = document.getElementById('mbtiDetailModal');
    const mbtiDetailType = document.getElementById('mbtiDetailType');
    const mbtiDetailDesc = document.getElementById('mbtiDetailDesc');
    const mbtiDetailLink = document.getElementById('mbtiDetailLink');
    const mbtiDetailClose = document.getElementById('mbtiDetailClose');

    function showMbtiDetail(type) {
      const info = MBTI_DATA[type];
      if (!info) return;
      mbtiDetailType.textContent = type + ' ' + info.name;
      mbtiDetailType.style.color = getTypeColor(type);
      mbtiDetailDesc.textContent = info.desc;
      mbtiDetailLink.href = 'https://www.16personalities.com/ch/' + type.toLowerCase() + '-人格';
      mbtiDetailModal.classList.add('show');
    }

    function getTypeColor(type) {
      if (['INTJ','INTP','ENTJ','ENTP'].includes(type)) return '#9b59b6';
      if (['INFJ','INFP','ENFJ','ENFP'].includes(type)) return '#27ae60';
      if (['ISTJ','ISFJ','ESTJ','ESFJ'].includes(type)) return '#3498db';
      return '#f39c12';
    }

    mbtiDetailClose.addEventListener('click', () => mbtiDetailModal.classList.remove('show'));
    mbtiDetailModal.addEventListener('click', (e) => {
      if (e.target === mbtiDetailModal) mbtiDetailModal.classList.remove('show');
    });

    // ========== 启动 ==========
    loadBlessings();
    loadQRCode();

    // ========== 留言板 ==========
    const msgBoardBtn = document.getElementById('msgBoardBtn');
    const msgBoardModal = document.getElementById('msgBoardModal');
    const msgBoardClose = document.getElementById('msgBoardClose');
    const msgBoardList = document.getElementById('msgBoardList');
    const msgSearch = document.getElementById('msgSearch');

    let searchQuery = '';

    msgBoardBtn.addEventListener('click', () => {
      searchQuery = '';
      msgSearch.value = '';
      renderMsgBoard();
      msgBoardModal.style.display = 'flex';
    });

    msgBoardClose.addEventListener('click', () => {
      msgBoardModal.style.display = 'none';
    });

    msgBoardModal.addEventListener('click', (e) => {
      if (e.target === msgBoardModal) msgBoardModal.style.display = 'none';
    });

    msgSearch.addEventListener('input', () => {
      searchQuery = msgSearch.value.trim().toLowerCase();
      renderMsgBoard();
    });

    function renderMsgBoard() {
      const sorted = [...blessingPool].sort((a, b) => 
        new Date(b.time) - new Date(a.time)
      );

      const filtered = searchQuery
        ? sorted.filter(b => 
            (b.name || '').toLowerCase().includes(searchQuery) ||
            (b.message || '').toLowerCase().includes(searchQuery) ||
            (MBTI_DATA[b.mbti_type]?.name || b.mbti_type || '').toLowerCase().includes(searchQuery)
          )
        : sorted;

      if (filtered.length === 0) {
        msgBoardList.innerHTML = '<p style="color: #888; text-align: center; padding: 40px;">' + 
          (searchQuery ? '无匹配留言' : '暂无留言') + '</p>';
        return;
      }

      msgBoardList.innerHTML = filtered.map(b => {
        const timeStr = b.time ? formatTime(b.time) : '';
        const emojiPrefix = b.emoji ? b.emoji + ' ' : '';
        const userId = getOrGenerateUserId();
        
        let mbtiHtml = '';
        if (b.mbti_type) {
          const color = getTypeColor(b.mbti_type);
          mbtiHtml = '<span style="display: inline-block; padding: 2px 8px; border-radius: 8px; font-size: 0.7em; font-weight: 700; margin-right: 8px; background: ' + color + '; color: #fff; cursor: pointer;" onclick="showMbtiDetail(\'' + b.mbti_type + '\')">' + (MBTI_DATA[b.mbti_type]?.name || b.mbti_type) + '</span>';
        }

        let audioHtml = '';
        if (b.audio) {
          audioHtml = '<span style="display: inline-flex; align-items: center; gap: 4px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; padding: 2px 8px; cursor: pointer; font-size: 0.8em; color: #fff; margin-left: 8px;" onclick="playMsgBoardAudio(\'' + b.audio + '\', this)">🎵 语音</span>';
        }

        let reactionsHtml = '';
        REACTION_EMOJIS.forEach(emoji => {
          const users = b.reactions?.[emoji] || [];
          const count = users.length;
          const reacted = users.includes(userId);
          if (count > 0 || true) { // show all emoji buttons
            reactionsHtml += '<span class="reaction-btn' + (reacted ? ' reacted' : '') + '" onclick="toggleReaction(\'' + b.id + '\',\'' + emoji + '\')">' + emoji + ' ' + (count || '') + '</span>';
          }
        });

        return '<div style="background: rgba(255,255,255,0.07); border-radius: 12px; padding: 14px; border-left: 3px solid ' + (b.color || '#764ba2') + ';"><div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px;"><div style="display: flex; align-items: center; flex-wrap: wrap; gap: 4px;">' + mbtiHtml + '<span style="font-weight: 600; color: ' + (b.color || '#fff') + ';">' + escapeHtml(b.name || '匿名') + '</span></div><span style="font-size: 0.75em; color: rgba(255,255,255,0.45); flex-shrink: 0; margin-left: 8px;">' + timeStr + '</span></div><div style="color: rgba(255,255,255,0.88); line-height: 1.6; word-break: break-word;">' + emojiPrefix + escapeHtml(b.message) + audioHtml + '</div>' + (reactionsHtml ? '<div style="display: flex; gap: 4px; margin-top: 9px; flex-wrap: wrap;">' + reactionsHtml + '</div>' : '') + '</div>';
      }).join('');
    }

    // 留言板音频播放
    let msgBoardCurrentAudio = null;
    let msgBoardCurrentBtn = null;

    window.playMsgBoardAudio = function(url, btn) {
      if (msgBoardCurrentBtn === btn && msgBoardCurrentAudio && !msgBoardCurrentAudio.paused) {
        msgBoardCurrentAudio.pause();
        msgBoardCurrentAudio.currentTime = 0;
        btn.style.background = 'rgba(255,255,255,0.1)';
        msgBoardCurrentAudio = null;
        msgBoardCurrentBtn = null;
        return;
      }
      if (msgBoardCurrentAudio) {
        msgBoardCurrentAudio.pause();
        msgBoardCurrentAudio.currentTime = 0;
        if (msgBoardCurrentBtn) msgBoardCurrentBtn.style.background = 'rgba(255,255,255,0.1)';
      }
      const audio = new Audio(url);
      msgBoardCurrentAudio = audio;
      msgBoardCurrentBtn = btn;
      btn.style.background = 'rgba(255,107,107,0.3)';
      audio.play().catch(e => console.error('播放失败', e));
      audio.onended = () => {
        btn.style.background = 'rgba(255,255,255,0.1)';
        msgBoardCurrentAudio = null;
        msgBoardCurrentBtn = null;
      };
    };

    // ========== 回应功能 ==========
    window.toggleReaction = function(blessingId, emoji) {
      fetch('/api/blessing/' + blessingId + '/react', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ emoji, userId: getOrGenerateUserId() })
      })
      .then(r => r.json())
      .then(data => {
        const b = blessingPool.find(b => b.id === blessingId);
        if (b) b.reactions = data.reactions;
        renderMsgBoard();
      })
      .catch(err => console.error('回应失败:', err));
    };

    // ========== 数据统计 ==========
    const statsBtn = document.getElementById('statsBtn');
    const statsModal = document.getElementById('statsModal');
    const statsClose = document.getElementById('statsClose');

    statsBtn.addEventListener('click', async () => {
      statsModal.style.display = 'flex';
      await loadStats();
    });

    statsClose.addEventListener('click', () => statsModal.style.display = 'none');
    statsModal.addEventListener('click', (e) => {
      if (e.target === statsModal) statsModal.style.display = 'none';
    });

    async function loadStats() {
      try {
        const res = await fetch('/api/stats');
        const stats = await res.json();
        renderStatsSummary(stats);
        drawMbtiPie(stats.mbtiDist);
        drawHourBar(stats.hourDist);
      } catch (e) {
        console.error('加载统计失败:', e);
      }
    }

    function renderStatsSummary(stats) {
      const el = document.getElementById('statsSummary');
      el.innerHTML = `
        <div class="stat-card">
          <div class="stat-num" style="color: #667eea;">${stats.total}</div>
          <div class="stat-label">💌 祝福总数</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" style="color: #f093fb;">${stats.withMbti}</div>
          <div class="stat-label">🧠 含 MBTI</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" style="color: #43e97b;">${stats.withAudio}</div>
          <div class="stat-label">🎵 含语音</div>
        </div>
      `;
    }

    function drawMbtiPie(mbtiDist) {
      const canvas = document.getElementById('mbtiPieChart');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const W = canvas.width, H = canvas.height;
      ctx.clearRect(0, 0, W, H);

      const entries = Object.entries(mbtiDist).sort((a, b) => b[1] - a[1]);
      const total = entries.reduce((s, e) => s + e[1], 0);
      if (total === 0) {
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.font = '16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('暂无 MBTI 数据', W/2, H/2);
        return;
      }

      const cx = W * 0.34, cy = H / 2;
      const r = Math.min(cx, cy) - 20;
      let angle = -Math.PI / 2;

      entries.forEach(([type, count]) => {
        const slice = (count / total) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, r, angle, angle + slice);
        ctx.closePath();
        ctx.fillStyle = MBTI_TYPE_COLORS[type] || '#95a5a6';
        ctx.fill();
        ctx.strokeStyle = 'rgba(26,26,46,0.7)';
        ctx.lineWidth = 2;
        ctx.stroke();
        angle += slice;
      });

      // donut hole
      ctx.beginPath();
      ctx.arc(cx, cy, r * 0.42, 0, Math.PI * 2);
      ctx.fillStyle = '#1a1a2e';
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 26px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(total, cx, cy - 8);
      ctx.font = '10px sans-serif';
      ctx.fillText('总测试', cx, cy + 12);

      // legend
      const lx = W * 0.62;
      let ly = 20;
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'left';
      entries.forEach(([type, count]) => {
        ctx.fillStyle = MBTI_TYPE_COLORS[type] || '#95a5a6';
        ctx.fillRect(lx, ly, 14, 14);
        ctx.fillStyle = '#ccc';
        ctx.fillText(MBTI_DATA[type]?.name || type, lx + 20, ly + 12);
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.fillText(count + '', lx + 180, ly + 12);
        ly += 20;
      });
    }

    function drawHourBar(hourDist) {
      const canvas = document.getElementById('hourBarChart');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const W = canvas.width, H = canvas.height;
      ctx.clearRect(0, 0, W, H);

      const vals = Object.values(hourDist);
      const maxVal = Math.max(...vals, 1);
      const pad = { top: 15, right: 15, bottom: 28, left: 32 };
      const cw = W - pad.left - pad.right, ch = H - pad.top - pad.bottom;
      const barW = Math.max(4, cw / 24 - 3);

      // grid lines
      ctx.strokeStyle = 'rgba(255,255,255,0.1)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 4; i++) {
        const y = pad.top + (ch / 4) * i;
        ctx.beginPath();
        ctx.moveTo(pad.left, y);
        ctx.lineTo(W - pad.right, y);
        ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.font = '10px sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(Math.round(maxVal * (1 - i / 4)), pad.left - 6, y + 4);
      }

      for (let h = 0; h < 24; h++) {
        const val = hourDist[h] || 0;
        const barH = (val / maxVal) * ch;
        const x = pad.left + h * (cw / 24) + 1;
        const y = pad.top + ch - barH;

        const grad = ctx.createLinearGradient(x, y, x, pad.top + ch);
        grad.addColorStop(0, '#667eea');
        grad.addColorStop(1, '#764ba2');
        ctx.fillStyle = grad;
        ctx.fillRect(x, y, barW, Math.max(barH, 2));

        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.font = '9px sans-serif';
        ctx.textAlign = 'center';
        if (h % 3 === 0) ctx.fillText(h + 'h', x + barW / 2, H - 4);
        if (val > 0 && maxVal <= 8) {
          ctx.fillStyle = 'rgba(255,255,255,0.7)';
          ctx.font = '8px sans-serif';
          ctx.fillText(val, x + barW / 2, y - 4);
        }
      }
    }
  </script>
</body>
