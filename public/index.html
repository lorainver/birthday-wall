<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎂 生日祝福墙</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* 语音播放按钮 */
    .audio-btn {
      display: inline-flex; align-items: center; gap: 4px;
      background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
      border-radius: 16px; padding: 2px 10px 2px 6px; cursor: pointer;
      color: inherit; font-size: 0.7em; margin-left: 8px;
      transition: all 0.2s; vertical-align: middle;
    }
    .audio-btn:hover { background: rgba(255,255,255,0.25); }
    .audio-btn .audio-icon { font-size: 1.2em; }
    .audio-btn.playing { background: rgba(255,107,107,0.3); border-color: rgba(255,107,107,0.5); }
    .audio-btn.playing .audio-icon { animation: speak 0.6s infinite alternate; }
    @keyframes speak {
      0% { transform: scale(1); }
      100% { transform: scale(1.3); }
    }
    /* 弹幕时间显示 */
    .danmaku-time {
      display: block;
      font-size: 0.6em;
      opacity: 0.5;
      margin-bottom: 2px;
    }
    /* MBTI 标签样式 */
    .mbti-tag {
      display: inline-flex; align-items: center;
      padding: 2px 8px; border-radius: 10px;
      font-size: 0.55em; font-weight: 700;
      margin-right: 6px; cursor: pointer;
      transition: transform 0.2s; vertical-align: middle;
      opacity: 0.9;
    }
    .mbti-tag:hover { transform: scale(1.15); opacity: 1; }
    /* NT 分析家紫色 */
    .mbti-tag.INTJ, .mbti-tag.INTP, .mbti-tag.ENTJ, .mbti-tag.ENTP {
      background: rgba(155,89,182,0.85); color: #fff;
    }
    /* NF 外交家绿色 */
    .mbti-tag.INFJ, .mbti-tag.INFP, .mbti-tag.ENFJ, .mbti-tag.ENFP {
      background: rgba(39,174,96,0.85); color: #fff;
    }
    /* SJ 守护者蓝色 */
    .mbti-tag.ISTJ, .mbti-tag.ISFJ, .mbti-tag.ESTJ, .mbti-tag.ESFJ {
      background: rgba(52,152,219,0.85); color: #fff;
    }
    /* SP 探索者黄色 */
    .mbti-tag.ISTP, .mbti-tag.ISFP, .mbti-tag.ESTP, .mbti-tag.ESFP {
      background: rgba(243,156,18,0.85); color: #fff;
    }
    /* MBTI 详情弹窗 */
    .mbti-detail-modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      display: none; align-items: center; justify-content: center;
      z-index: 300; padding: 20px;
    }
    .mbti-detail-modal.show { display: flex; }
    .mbti-detail-content {
      background: #fff; border-radius: 20px; padding: 24px;
      max-width: 360px; width: 100%; text-align: center;
      animation: pop-in 0.3s ease;
    }
    .mbti-detail-type { font-size: 2.5rem; font-weight: 800; margin-bottom: 6px; }
    .mbti-detail-name { font-size: 1.2rem; color: #555; margin-bottom: 10px; }
    .mbti-detail-desc { font-size: 0.95rem; color: #666; line-height: 1.6; margin-bottom: 16px; }
    .mbti-detail-link {
      display: inline-block;
      font-size: 0.85rem;
      color: #764ba2;
      text-decoration: none;
      margin-bottom: 12px;
      padding: 4px 12px;
      border-radius: 6px;
      background: rgba(118, 75, 162, 0.1);
      transition: all 0.2s;
    }
    .mbti-detail-link:hover { background: rgba(118, 75, 162, 0.2); }
    .mbti-detail-close { padding: 10px 24px; border: none; border-radius: 10px; background: #764ba2; color: #fff; cursor: pointer; font-size: 0.95rem; }
  </style>
</head>
<body>
  <!-- 背景层 -->
  <div id="bg-layer"></div>

  <!-- 标题区 -->
  <header id="header">
    <h1 id="title">🎂 生日快乐 🎂</h1>
    <p id="subtitle">扫码送出你的祝福</p>
    <div id="counter">
      <span class="counter-icon">💌</span>
      <span class="counter-text">已收到 <span id="count">0</span> 条祝福</span>
    </div>
    <button id="msgBoardBtn" style="
      margin-top: 12px; padding: 10px 24px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none; border-radius: 25px;
      color: #fff; font-size: 1rem; cursor: pointer;
      box-shadow: 0 4px 15px rgba(102,126,234,0.4);
      transition: all 0.3s;
    " onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
      📋 查看留言板
    </button>
  </header>

  <!-- 弹幕层 -->
  <div id="danmaku-layer"></div>

  <!-- 二维码浮窗 -->
  <div id="qr-float" title="点击查看大图">
    <img id="qr-img" src="" alt="扫码送祝福">
    <span>扫码送祝福</span>
  </div>

  <!-- MBTI 详情弹窗 -->
  <div class="mbti-detail-modal" id="mbtiDetailModal">
    <div class="mbti-detail-content">
      <div class="mbti-detail-type" id="mbtiDetailType"></div>
      <div class="mbti-detail-desc" id="mbtiDetailDesc"></div>
      <a class="mbti-detail-link" id="mbtiDetailLink" href="#" target="_blank">🔗 了解详情 →</a>
      <button class="mbti-detail-close" id="mbtiDetailClose">知道了</button>
    </div>
  </div>

  <!-- 留言板弹窗 -->
  <div class="msg-board-modal" id="msgBoardModal" style="
    position: fixed; inset: 0; background: rgba(0,0,0,0.8);
    display: none; align-items: center; justify-content: center;
    z-index: 400; padding: 20px;
  ">
    <div style="
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      border-radius: 20px; padding: 24px;
      max-width: 600px; width: 100%; max-height: 80vh;
      overflow-y: auto; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    ">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h2 style="color: #fff; font-size: 1.5rem; margin: 0;">📋 留言板</h2>
        <button id="msgBoardClose" style="
          background: rgba(255,255,255,0.2); border: none;
          color: #fff; font-size: 1.5rem; cursor: pointer;
          padding: 8px 16px; border-radius: 10px;
        ">×</</button>
      </div>
      <div id="msgBoardList" style="
        display: flex; flex-direction: column; gap: 12px;
      "></div>
    </div>
  </div>

  <script>
    // ========== 配置 ==========
    const CONFIG = {
      title: '🎂 生日快乐 🎂',
      subtitle: '扫码送出你的祝福',
      bgImage: '/assets/birthday.png',
      maxDanmaku: 30,
      danmakuSpeed: { min: 8, max: 15 },
      danmakuFontSize: { min: 22, max: 40 },
      loopInterval: 3000,
    };

    // ========== 初始化 ==========
    document.getElementById('title').textContent = CONFIG.title;
    document.getElementById('subtitle').textContent = CONFIG.subtitle;
    if (CONFIG.bgImage) {
      document.getElementById('bg-layer').style.backgroundImage = `url(${CONFIG.bgImage})`;
    }

    // ========== 音频播放管理 ==========
    let currentPlayingAudio = null; // 当前正在播放的音频
    let currentPlayingBtn = null;   // 当前正在播放的按钮

    function playAudio(audioUrl, btnElement) {
      // 如果点击的是正在播放的按钮，则停止
      if (currentPlayingBtn === btnElement && currentPlayingAudio && !currentPlayingAudio.paused) {
        currentPlayingAudio.pause();
        currentPlayingAudio.currentTime = 0;
        btnElement.classList.remove('playing');
        currentPlayingAudio = null;
        currentPlayingBtn = null;
        return;
      }
      // 停止之前的播放
      if (currentPlayingAudio) {
        currentPlayingAudio.pause();
        currentPlayingAudio.currentTime = 0;
        if (currentPlayingBtn) currentPlayingBtn.classList.remove('playing');
      }
      // 播放新的
      const audio = new Audio(audioUrl);
      currentPlayingAudio = audio;
      currentPlayingBtn = btnElement;
      btnElement.classList.add('playing');
      audio.play().catch(err => {
        console.error('播放失败:', err);
        btnElement.classList.remove('playing');
      });
      audio.onended = () => {
        btnElement.classList.remove('playing');
        currentPlayingAudio = null;
        currentPlayingBtn = null;
      };
      audio.onerror = () => {
        btnElement.classList.remove('playing');
        currentPlayingAudio = null;
        currentPlayingBtn = null;
      };
    }

    // ========== WebSocket ==========
    let ws;
    function connectWS() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${location.host}`);
      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === 'new_blessing') {
          blessingCount++;
          updateCounter();
          blessingPool.push(msg.data);
          addDanmaku(msg.data);
        } else if (msg.type === 'delete_blessing') {
          // 撤回祝福
          const id = msg.id;
          // 从池中移除
          const idx = blessingPool.findIndex(b => b.id === id);
          if (idx > -1) blessingPool.splice(idx, 1);
          // 更新计数
          blessingCount = Math.max(0, blessingCount - 1);
          updateCounter();
          // 移除页面上对应的弹幕元素
          document.querySelectorAll('.danmaku-item[data-id="' + id + '"]').forEach(el => el.remove());
        }
      };
      ws.onclose = () => setTimeout(connectWS, 2000);
    }
    connectWS();

    // ========== 计数器 ==========
    let blessingCount = 0;
    const countEl = document.getElementById('count');

    function updateCounter() {
      countEl.textContent = blessingCount;
      countEl.parentElement.parentElement.classList.add('counter-bump');
      setTimeout(() => countEl.parentElement.parentElement.classList.remove('counter-bump'), 400);
    }

    // ========== 弹幕 ==========
    const danmakuLayer = document.getElementById('danmaku-layer');
    let danmakuCount = 0;
    const blessingPool = [];

    function addDanmaku(b) {
      if (danmakuCount >= CONFIG.maxDanmaku) return;
      danmakuCount++;

      const el = document.createElement('div');
      el.className = 'danmaku-item';
      el.dataset.id = b.id;

      // 发送时间
      if (b.time) {
        const timeSpan = document.createElement('span');
        timeSpan.className = 'danmaku-time';
        timeSpan.textContent = formatTime(b.time);
        el.appendChild(timeSpan);
      }

      const emojiPrefix = b.emoji ? b.emoji + ' ' : '';

      // 文字内容
      const textSpan = document.createElement('span');
      // MBTI 标签
      if (b.mbti_type) {
        const mbtiTag = document.createElement('span');
        mbtiTag.className = 'mbti-tag ' + b.mbti_type;
        mbtiTag.textContent = MBTI_DATA[b.mbti_type]?.name || b.mbti_type;  // 显示中文名称
        el.appendChild(mbtiTag);
        // 整个弹幕可点击查看 MBTI 详情
        el.style.cursor = 'pointer';
        el.addEventListener('click', () => showMbtiDetail(b.mbti_type));
      }
      textSpan.textContent = `${emojiPrefix}${b.name}: ${b.message}`;
      el.appendChild(textSpan);

      // 语音按钮
      if (b.audio) {
        const audioBtn = document.createElement('span');
        audioBtn.className = 'audio-btn';
        audioBtn.innerHTML = '<span class="audio-icon">🎵</span>语音';
        audioBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          playAudio(b.audio, audioBtn);
        });
        // 阻止弹幕动画干扰
        audioBtn.addEventListener('mousedown', (e) => e.stopPropagation());
        audioBtn.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });
        el.appendChild(audioBtn);
      }

      const fontSize = randInt(CONFIG.danmakuFontSize.min, CONFIG.danmakuFontSize.max);
      const duration = randInt(CONFIG.danmakuSpeed.min, CONFIG.danmakuSpeed.max);
      const top = randInt(60, window.innerHeight - 80);

      el.style.cssText = `
        font-size: ${fontSize}px;
        color: ${b.color || '#fff'};
        top: ${top}px;
        animation-duration: ${duration}s;
        text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
        display: flex;
        align-items: center;
      `;

      danmakuLayer.appendChild(el);
      el.addEventListener('animationend', () => {
        el.remove();
        danmakuCount--;
      });
    }

    // 循环播放：从池中随机取一条弹幕
    function startLoop() {
      setInterval(() => {
        if (blessingPool.length === 0) return;
        const b = blessingPool[Math.floor(Math.random() * blessingPool.length)];
        addDanmaku(b);
      }, CONFIG.loopInterval);
    }

    // ========== 加载历史祝福 ==========
    async function loadBlessings() {
      try {
        const res = await fetch('/api/blessings');
        const data = await res.json();
        blessingCount = data.length;
        updateCounter();
        data.forEach(b => {
          blessingPool.push(b);
          addDanmaku(b);
        });
        startLoop();
      } catch (e) {
        console.error('加载祝福失败:', e);
      }
    }

    // ========== 加载二维码 ==========
    async function loadQRCode() {
      try {
        const res = await fetch('/api/qrcode');
        const data = await res.json();
        document.getElementById('qr-img').src = data.qr;
      } catch (e) {
        console.error('加载二维码失败:', e);
      }
    }

    // ========== 工具函数 ==========
    function randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    // 格式化时间显示
    function formatTime(isoStr) {
      const d = new Date(isoStr);
      const now = new Date();
      const h = d.getHours().toString().padStart(2, '0');
      const m = d.getMinutes().toString().padStart(2, '0');
      const isToday = d.toDateString() === now.toDateString();
      if (isToday) return h + ':' + m;
      const month = (d.getMonth() + 1).toString().padStart(2, '0');
      const day = d.getDate().toString().padStart(2, '0');
      return month + '/' + day + ' ' + h + ':' + m;
    }

    function escapeHtml(s) {
      const div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }

    function formatTime(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      return `${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
    }

    // ========== MBTI 详情 ==========
    const MBTI_DATA = {
      INTJ: { name: '建筑师', desc: '富有想象力的战略家，一切皆在计划中。独立果断，对知识有强烈的渴望。' },
      INTP: { name: '逻辑学家', desc: '不知疲倦的思考者，对知识和理论有无穷的好奇心。追求逻辑自洽，喜欢探索抽象概念。' },
      ENTJ: { name: '指挥官', desc: '大胆果断的天生领袖，善于制定长远计划并推动团队执行。气场强大，目标明确。' },
      ENTP: { name: '辩论家', desc: '聪明好奇的思想实验者，热爱智力挑战和头脑风暴。思维敏捷，喜欢打破常规。' },
      INFJ: { name: '提倡者', desc: '安静而神秘的理想主义者，洞察力强，总是思考如何让世界更美好。' },
      INFP: { name: '调停者', desc: '诗意善良的利他主义者，内心丰富且充满理想。对世界有独特的理解和深沉的共情。' },
      ENFJ: { name: '主人公', desc: '富有魅力的激励者，天生的影响力让周围人愿意追随。善于鼓舞人心，推动改变。' },
      ENFP: { name: '竞选者', desc: '热情洋溢的自由精灵，永远充满创意和可能性。好奇心旺盛，感染力十足。' },
      ISTJ: { name: '物流师', desc: '务实可靠的秩序守护者，一丝不苟地履行职责。重视传统，值得信赖。' },
      ISFJ: { name: '守卫者', desc: '温暖体贴的保护者，默默守护身边的人。细心周到，是团队中不可或缺的支柱。' },
      ESTJ: { name: '总经理', desc: '高效务实的组织者，善于建立秩序和制度。做事有计划，执行力超强。' },
      ESFJ: { name: '执行者', desc: '热心肠的社交家，总是把别人的需求放在心上。善于营造温馨和谐的团队氛围。' },
      ISTP: { name: '鉴赏家', desc: '大胆实际的实验家，喜欢动手探索世界。冷静理性，擅长在紧急时刻解决问题。' },
      ISFP: { name: '探险家', desc: '灵活随性的艺术家，用行动和美感诠释世界。内心丰富但低调，活在当下。' },
      ESTP: { name: '企业家', desc: '活力满满的机会主义者，享受冒险和即兴发挥。反应极快，永远走在最前沿。' },
      ESFP: { name: '表演者', desc: '自发的娱乐家，天生自带光环。热情洋溢，走到哪里都是派对的中心。' },
    };

    const mbtiDetailModal = document.getElementById('mbtiDetailModal');
    const mbtiDetailType = document.getElementById('mbtiDetailType');
    const mbtiDetailDesc = document.getElementById('mbtiDetailDesc');
    const mbtiDetailLink = document.getElementById('mbtiDetailLink');
    const mbtiDetailClose = document.getElementById('mbtiDetailClose');

    function showMbtiDetail(type) {
      const info = MBTI_DATA[type];
      if (!info) return;
      mbtiDetailType.textContent = type + ' ' + info.name;  // 显示"INTJ 建筑师"格式
      mbtiDetailType.style.color = getTypeColor(type);
      mbtiDetailDesc.textContent = info.desc;
      mbtiDetailLink.href = 'https://www.16personalities.com/ch/' + type.toLowerCase() + '-人格';
      mbtiDetailModal.classList.add('show');
    }

    function getTypeColor(type) {
      if (['INTJ','INTP','ENTJ','ENTP'].includes(type)) return '#9b59b6';
      if (['INFJ','INFP','ENFJ','ENFP'].includes(type)) return '#27ae60';
      if (['ISTJ','ISFJ','ESTJ','ESFJ'].includes(type)) return '#3498db';
      return '#f39c12';
    }

    mbtiDetailClose.addEventListener('click', () => mbtiDetailModal.classList.remove('show'));
    mbtiDetailModal.addEventListener('click', (e) => {
      if (e.target === mbtiDetailModal) mbtiDetailModal.classList.remove('show');
    });

    // ========== 启动 ==========
    loadBlessings();
    loadQRCode();

    // ========== 留言板 ==========
    const msgBoardBtn = document.getElementById('msgBoardBtn');
    const msgBoardModal = document.getElementById('msgBoardModal');
    const msgBoardClose = document.getElementById('msgBoardClose');
    const msgBoardList = document.getElementById('msgBoardList');

    msgBoardBtn.addEventListener('click', () => {
      renderMsgBoard();
      msgBoardModal.style.display = 'flex';
    });

    msgBoardClose.addEventListener('click', () => {
      msgBoardModal.style.display = 'none';
    });

    msgBoardModal.addEventListener('click', (e) => {
      if (e.target === msgBoardModal) {
        msgBoardModal.style.display = 'none';
      }
    });

    function renderMsgBoard() {
      // 按时间倒序排列（最新的在最上面）
      const sorted = [...blessingPool].sort((a, b) => 
        new Date(b.time) - new Date(a.time)
      );

      if (sorted.length === 0) {
        msgBoardList.innerHTML = '<p style="color: #888; text-align: center; padding: 40px;">暂无留言</p>';
        return;
      }

      msgBoardList.innerHTML = sorted.map(b => {
        const timeStr = b.time ? formatTime(b.time) : '';
        const emojiPrefix = b.emoji ? b.emoji + ' ' : '';
        
        // MBTI 标签
        let mbtiHtml = '';
        if (b.mbti_type) {
          const mbtiInfo = MBTI_DATA[b.mbti_type];
          const color = getTypeColor(b.mbti_type);
          mbtiHtml = `<span style="
            display: inline-block; padding: 2px 8px; border-radius: 8px;
            font-size: 0.7em; font-weight: 700; margin-right: 8px;
            background: ${color}; color: #fff; cursor: pointer;
          " onclick="showMbtiDetail('${b.mbti_type}')">${mbtiInfo?.name || b.mbti_type}</span>`;
        }

        // 语音按钮
        let audioHtml = '';
        if (b.audio) {
          audioHtml = `<span style="
            display: inline-flex; align-items: center; gap: 4px;
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px; padding: 2px 8px; cursor: pointer;
            font-size: 0.8em; color: #fff; margin-left: 8px;
          " onclick="playMsgBoardAudio('${b.audio}', this)">🎵 语音</span>`;
        }

        return `
          <div style="
            background: rgba(255,255,255,0.08);
            border-radius: 12px; padding: 16px;
            border-left: 4px solid ${b.color || '#764ba2'};
          ">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px;">
              <div style="display: flex; align-items: center; flex-wrap: wrap; gap: 4px;">
                ${mbtiHtml}
                <span style="font-weight: 600; color: ${b.color || '#fff'};">${escapeHtml(b.name || '匿名')}</span>
              </div>
              <span style="font-size: 0.75em; color: rgba(255,255,255,0.5);">${timeStr}</span>
            </div>
            <div style="color: rgba(255,255,255,0.9); line-height: 1.6; word-break: break-word;">
              ${emojiPrefix}${escapeHtml(b.message)}${audioHtml}
            </div>
          </div>
        `;
      }).join('');
    }

    // 留言板音频播放
    let msgBoardCurrentAudio = null;
    let msgBoardCurrentBtn = null;

    window.playMsgBoardAudio = function(url, btn) {
      if (msgBoardCurrentBtn === btn && msgBoardCurrentAudio && !msgBoardCurrentAudio.paused) {
        msgBoardCurrentAudio.pause();
        msgBoardCurrentAudio.currentTime = 0;
        btn.style.background = 'rgba(255,255,255,0.1)';
        msgBoardCurrentAudio = null;
        msgBoardCurrentBtn = null;
        return;
      }
      if (msgBoardCurrentAudio) {
        msgBoardCurrentAudio.pause();
        msgBoardCurrentAudio.currentTime = 0;
        if (msgBoardCurrentBtn) msgBoardCurrentBtn.style.background = 'rgba(255,255,255,0.1)';
      }
      const audio = new Audio(url);
      msgBoardCurrentAudio = audio;
      msgBoardCurrentBtn = btn;
      btn.style.background = 'rgba(255,107,107,0.3)';
      audio.play().catch(e => console.error('播放失败', e));
      audio.onended = () => {
        btn.style.background = 'rgba(255,255,255,0.1)';
        msgBoardCurrentAudio = null;
        msgBoardCurrentBtn = null;
      };
    };
  </script>
</body>
</html>
