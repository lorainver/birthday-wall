<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>送出生日祝福</title>
  <link rel="stylesheet" href="submit.css">
  <style>
    /* 烟花特效 Canvas */
    #fireworkCanvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 100;
      display: none;
    }
    #fireworkCanvas.show { display: block; }

    /* MBTI 样式 */
    .mbti-field { margin-bottom: 20px; }
    .mbti-field label { display: block; margin-bottom: 8px; font-size: 14px; color: #666; }
    .mbti-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .mbti-select {
      flex: 1; min-width: 120px; padding: 10px 14px;
      border: 2px solid #e8e8e8; border-radius: 10px;
      font-size: 15px; background: #fafafa; cursor: pointer;
      transition: border-color 0.3s;
    }
    .mbti-select:focus { border-color: #764ba2; outline: none; background: #fff; }
    .btn-mbti-test {
      padding: 10px 18px; border: 2px solid #764ba2; border-radius: 10px;
      background: transparent; color: #764ba2; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: all 0.2s; white-space: nowrap;
    }
    .btn-mbti-test:hover { background: #764ba2; color: #fff; }
    /* MBTI 测试弹窗 */
    .mbti-modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      display: none; align-items: center; justify-content: center;
      z-index: 200; padding: 20px;
    }
    .mbti-modal.show { display: flex; }
    .mbti-modal-content {
      background: #fff; border-radius: 20px; padding: 28px;
      max-width: 420px; width: 100%; max-height: 80vh; overflow-y: auto;
      animation: pop-in 0.3s ease;
    }
    .mbti-modal h3 { font-size: 1.3rem; color: #333; margin-bottom: 6px; text-align: center; }
    .mbti-modal .subtitle { text-align: center; color: #888; font-size: 0.9rem; margin-bottom: 20px; }
    .mbti-progress { display: flex; gap: 4px; margin-bottom: 20px; justify-content: center; }
    .mbti-progress-dot { width: 10px; height: 10px; border-radius: 50%; background: #e0e0e0; transition: all 0.3s; }
    .mbti-progress-dot.active { background: #764ba2; transform: scale(1.2); }
    .mbti-progress-dot.done { background: #6bcb77; }
    .mbti-question { font-size: 1.1rem; color: #444; margin-bottom: 18px; text-align: center; line-height: 1.6; }
    .mbti-options { display: flex; flex-direction: column; gap: 10px; }
    .mbti-option {
      padding: 14px 18px; border: 2px solid #e8e8e8; border-radius: 12px;
      background: #fafafa; cursor: pointer; transition: all 0.2s; font-size: 0.95rem; text-align: left;
    }
    .mbti-option:hover { border-color: #764ba2; background: #f8f0ff; }
    .mbti-option.selected { border-color: #764ba2; background: #f0e6ff; }
    .mbti-result { text-align: center; }
    .mbti-result-type { font-size: 3rem; font-weight: 700; margin: 10px 0; }
    .mbti-result-type.ENFP, .mbti-result-type.ENFJ, .mbti-result-type.INFP, .mbti-result-type.INFJ { color: #27ae60; }
    .mbti-result-type.INTJ, .mbti-result-type.INTP, .mbti-result-type.ENTJ, .mbti-result-type.ENTP { color: #9b59b6; }
    .mbti-result-type.ISTJ, .mbti-result-type.ISFJ, .mbti-result-type.ESTJ, .mbti-result-type.ESFJ { color: #3498db; }
    .mbti-result-type.ISTP, .mbti-result-type.ISFP, .mbti-result-type.ESTP, .mbti-result-type.ESFP { color: #f39c12; }
    .mbti-result-name { font-size: 1.1rem; color: #555; margin-bottom: 10px; }
    .mbti-result-desc { font-size: 0.9rem; color: #666; line-height: 1.6; margin-bottom: 20px; }
    .btn-mbti-confirm { width: 100%; padding: 12px; border: none; border-radius: 12px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; }
    .btn-mbti-close { position: absolute; top: 16px; right: 16px; width: 32px; height: 32px; border: none; background: #f0f0f0; border-radius: 50%; cursor: pointer; font-size: 18px; }

    /* 撤回按钮样式 */
    .withdraw-hint { margin-top: 16px; text-align: center; }
    .btn-withdraw {
      background: none; border: none; color: #999; font-size: 0.85rem;
      cursor: pointer; text-decoration: underline; padding: 4px 8px;
      transition: color 0.2s;
    }
    .btn-withdraw:hover { color: #e74c3c; }

    /* 录音按钮样式 */
    .record-field { margin-bottom: 20px; }
    .record-field label { display: block; margin-bottom: 8px; font-size: 14px; color: #666; }
    .record-field label .label-hint { font-size: 12px; color: #aaa; }
    .record-area { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .btn-record, .btn-upload-audio {
      width: 56px; height: 56px; border-radius: 50%; border: none;
      background: linear-gradient(135deg, #ff6b6b, #ee5a24);
      color: #fff; font-size: 24px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 15px rgba(238,90,36,0.3);
      transition: all 0.2s; user-select: none; -webkit-user-select: none;
      position: relative;
    }
    .btn-upload-audio { background: linear-gradient(135deg, #4d96ff, #6bcb77); }
    .btn-record:hover, .btn-upload-audio:hover { transform: scale(1.05); }
    .btn-record:active, .btn-record.recording {
      transform: scale(1.15);
      box-shadow: 0 6px 25px rgba(238,90,36,0.5);
    }
    .btn-record.recording {
      animation: pulse-rec 1s infinite;
    }
    @keyframes pulse-rec {
      0%, 100% { box-shadow: 0 0 0 0 rgba(238,90,36,0.4); }
      50% { box-shadow: 0 0 0 15px rgba(238,90,36,0); }
    }
    .record-status {
      font-size: 14px; color: #888; min-width: 80px;
    }
    .record-status .rec-dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: #ff4444; margin-right: 6px; vertical-align: middle;
      animation: blink 1s infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .preview-area {
      display: none; align-items: center; gap: 8px;
      background: #f8f8f8; border-radius: 20px; padding: 6px 14px;
    }
    .preview-area.show { display: flex; }
    .preview-area audio { height: 36px; max-width: 180px; }
    .btn-del-audio {
      background: none; border: none; font-size: 18px; cursor: pointer;
      color: #ccc; padding: 4px; line-height: 1;
    }
    .btn-del-audio:hover { color: #ff6b6b; }
    .record-tip { font-size: 12px; color: #bbb; margin-top: 6px; }
  </style>
</head>
<body>
  <!-- 烟花特效画布 -->
  <canvas id="fireworkCanvas"></canvas>

  <div class="container">
    <!-- 装饰粒子 -->
    <div class="particles" id="particles"></div>

    <div class="card">
      <h1 class="logo">🎂</h1>
      <h2 class="heading">送出生日祝福</h2>
      <p class="desc">写下你对寿星的美好祝愿吧~</p>

      <form id="form" autocomplete="off">
        <div class="field">
          <label for="name">你的昵称</label>
          <input type="text" id="name" placeholder="输入你的名字" maxlength="20">
        </div>

        <div class="field">
          <label>祝福模板 <span class="label-hint">(点击快速填写)</span></label>
          <div class="templates" id="templates">
            <button type="button" class="tpl-btn">生日快乐🎂</button>
            <button type="button" class="tpl-btn">万事如意🎉</button>
            <button type="button" class="tpl-btn">身体健康💪</button>
            <button type="button" class="tpl-btn">心想事成✨</button>
            <button type="button" class="tpl-btn">前程似锦🌟</button>
            <button type="button" class="tpl-btn">天天开心😄</button>
            <button type="button" class="tpl-btn">越来越好💖</button>
            <button type="button" class="tpl-btn">永远年轻🌸</button>
          </div>
        </div>

        <div class="field">
          <label for="message">祝福语</label>
          <textarea id="message" placeholder="写下你的祝福..." rows="4" maxlength="200" required></textarea>
          <span class="char-count"><span id="count">0</span>/200</span>
        </div>

        <!-- 语音祝福 -->
        <div class="field record-field">
          <label>语音祝福 <span class="label-hint">(可选)</span></label>
          <div class="record-area">
            <button type="button" class="btn-record" id="btnRecord" title="按住录音（需要HTTPS）">🎙️</button>
            <label class="btn-upload-audio" title="上传音频文件">
              📁
              <input type="file" id="audioFile" accept="audio/*" style="display:none">
            </label>
            <div class="record-status" id="recordStatus">按住录音 或 点击📁上传</div>
            <div class="preview-area" id="previewArea">
              <audio id="previewAudio" controls></audio>
              <button type="button" class="btn-del-audio" id="btnDelAudio" title="删除音频">✕</button>
            </div>
          </div>
          <div class="record-tip" id="recordTip">录音需HTTPS，上传音频文件无需HTTPS</div>
        </div>

        <div class="field">
          <label>选个表情 <span class="label-hint">(可选)</span></label>
          <div class="emoji-picker" id="emojiPicker">
            <div class="emoji-option selected" data-emoji="">无</div>
            <div class="emoji-option" data-emoji="🎂">🎂</div>
            <div class="emoji-option" data-emoji="🎉">🎉</div>
            <div class="emoji-option" data-emoji="🎈">🎈</div>
            <div class="emoji-option" data-emoji="🎁">🎁</div>
            <div class="emoji-option" data-emoji="💖">💖</div>
            <div class="emoji-option" data-emoji="🌹">🌹</div>
            <div class="emoji-option" data-emoji="🥂">🥂</div>
            <div class="emoji-option" data-emoji="🍰">🍰</div>
            <div class="emoji-option" data-emoji="⭐">⭐</div>
            <div class="emoji-option" data-emoji="🌟">🌟</div>
            <div class="emoji-option" data-emoji="💕">💕</div>
            <div class="emoji-option" data-emoji="🎊">🎊</div>
            <div class="emoji-option" data-emoji="🥳">🥳</div>
            <div class="emoji-option" data-emoji="💐">💐</div>
            <div class="emoji-option" data-emoji="🎀">🎀</div>
          </div>
        </div>

        <div class="field">
          <label>弹幕颜色</label>
          <div class="color-picker" id="colorPicker">
            <div class="color-option selected" data-color="#ffffff" style="background:#ffffff"></div>
            <div class="color-option" data-color="#ff6b6b" style="background:#ff6b6b"></div>
            <div class="color-option" data-color="#ffd93d" style="background:#ffd93d"></div>
            <div class="color-option" data-color="#6bcb77" style="background:#6bcb77"></div>
            <div class="color-option" data-color="#4d96ff" style="background:#4d96ff"></div>
            <div class="color-option" data-color="#ff9a9e" style="background:#ff9a9e"></div>
            <div class="color-option" data-color="#a18cd1" style="background:#a18cd1"></div>
            <div class="color-option" data-color="#fbc2eb" style="background:#fbc2eb"></div>
          </div>
        </div>

        <!-- MBTI 性格类型 -->
        <div class="mbti-field">
          <label>你的 MBTI 性格 <span class="label-hint">可选，增加趣味</span></label>
          <div class="mbti-row">
            <select class="mbti-select" id="mbtiSelect">
              <option value="">未选择</option>
              <optgroup label="分析家(NT)">
                <option value="INTJ">INTJ - 建筑师</option>
                <option value="INTP">INTP - 逻辑学家</option>
                <option value="ENTJ">ENTJ - 指挥官</option>
                <option value="ENTP">ENTP - 辩论家</option>
              </optgroup>
              <optgroup label="外交家(NF)">
                <option value="INFJ">INFJ - 提倡者</option>
                <option value="INFP">INFP - 调停者</option>
                <option value="ENFJ">ENFJ - 主人公</option>
                <option value="ENFP">ENFP - 竞选者</option>
              </optgroup>
              <optgroup label="守护者(SJ)">
                <option value="ISTJ">ISTJ - 物流师</option>
                <option value="ISFJ">ISFJ - 守卫者</option>
                <option value="ESTJ">ESTJ - 总经理</option>
                <option value="ESFJ">ESFJ - 执行者</option>
              </optgroup>
              <optgroup label="探索者(SP)">
                <option value="ISTP">ISTP - 鉴赏家</option>
                <option value="ISFP">ISFP - 探险家</option>
                <option value="ESTP">ESTP - 企业家</option>
                <option value="ESFP">ESFP - 表演者</option>
              </optgroup>
            </select>
            <button class="btn-mbti-test" id="btnMbtiTest">快速测试</button>
          </div>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
          <span class="btn-text">送出祝福 🎉</span>
          <span class="btn-loading" style="display:none">发送中...</span>
        </button>
      </form>

      <!-- 成功提示 -->
      <div class="success-overlay" id="successOverlay">
        <div class="success-content">
          <div class="success-icon">🎉</div>
          <h3>祝福已送出!</h3>
          <p>你的祝福将在大屏上飘过~</p>
          <p class="redirect-hint" id="redirectHint"><span id="countdown">3</span> 秒后跳转到弹幕墙...</p>
          <div class="success-btns">
            <button class="btn-view" id="btnView">查看弹幕墙</button>
            <button class="btn-again" id="btnAgain">再送一条</button>
          </div>
          <p class="withdraw-hint">
            <button class="btn-withdraw" id="btnWithdraw">撤回此祝福</button>
          </p>
        </div>
      </div>
    </div>

    <!-- MBTI 测试弹窗 -->
  <div class="mbti-modal" id="mbtiModal">
    <div class="mbti-modal-content" style="position:relative">
      <button class="btn-mbti-close" id="btnMbtiClose">&times;</button>
      <h3 id="mbtiModalTitle">快速 MBTI 测试</h3>
      <p class="subtitle" id="mbtiModalSubtitle">10 道题，1 分钟搞定</p>
      <div class="mbti-progress" id="mbtiProgress"></div>
      <div id="mbtiQuestionArea">
        <div class="mbti-question" id="mbtiQuestion"></div>
        <div class="mbti-options" id="mbtiOptions"></div>
      </div>
      <div class="mbti-result" id="mbtiResult" style="display:none">
        <div class="mbti-result-type" id="mbtiResultType"></div>
        <div class="mbti-result-name" id="mbtiResultName"></div>
        <div class="mbti-result-desc" id="mbtiResultDesc"></div>
        <button class="btn-mbti-confirm" id="btnMbtiConfirm">确认选择</button>
      </div>
    </div>
  </div>

  <!-- 弹幕墙入口 -->
    <div class="display-link" id="displayLink">
      <img id="qrImg" src="" alt="弹幕墙二维码">
      <div class="display-link-text">
        <span class="display-link-label">📺 查看弹幕墙</span>
        <span class="display-link-url" id="displayUrl"></span>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('form');
    const messageInput = document.getElementById('message');
    const countSpan = document.getElementById('count');
    const colorPicker = document.getElementById('colorPicker');
    const emojiPicker = document.getElementById('emojiPicker');
    const templates = document.getElementById('templates');
    const submitBtn = document.getElementById('submitBtn');
    const successOverlay = document.getElementById('successOverlay');
    const btnAgain = document.getElementById('btnAgain');
    const btnView = document.getElementById('btnView');
    const countdownEl = document.getElementById('countdown');
    const redirectHint = document.getElementById('redirectHint');

    let selectedColor = '#ffffff';
    let selectedEmoji = '';
    let selectedMbti = '';
    let lastBlessingId = null; // 最近发送的祝福 ID

    // ========== 录音功能 ==========
    const btnRecord = document.getElementById('btnRecord');
    const recordStatus = document.getElementById('recordStatus');
    const previewArea = document.getElementById('previewArea');
    const previewAudio = document.getElementById('previewAudio');
    const btnDelAudio = document.getElementById('btnDelAudio');
    const recordTip = document.getElementById('recordTip');

    let mediaRecorder = null;
    let audioChunks = [];
    let audioBlob = null;       // 录音完成后的 Blob
    let isRecording = false;
    let recTimer = null;
    let recSeconds = 0;
    const MAX_REC_SECONDS = 30; // 最长录音时长

    // 检查浏览器是否支持录音
    function checkRecorderSupport() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
        return false;
      }
      // 检查是否是安全上下文（HTTPS或localhost）
      if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
        return false;
      }
      return true;
    }

    // ========== 音频文件上传 ==========
    const audioFileInput = document.getElementById('audioFile');
    let uploadedAudioFile = null;  // 上传的音频文件

    audioFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 10 * 1024 * 1024) {
        alert('音频文件不能超过10MB');
        return;
      }
      uploadedAudioFile = file;
      audioBlob = null;  // 清除录音
      const url = URL.createObjectURL(file);
      previewAudio.src = url;
      previewArea.classList.add('show');
      recordStatus.textContent = '已上传: ' + file.name.substring(0, 15);
      recordTip.textContent = '点击 ✕ 可删除重新选择';
    });

    // 删除音频（录音或上传的文件）
    function deleteRecording() {
      audioBlob = null;
      uploadedAudioFile = null;
      audioChunks = [];
      previewAudio.src = '';
      previewArea.classList.remove('show');
      recordStatus.textContent = '按住录音 或 点击📁上传';
      recordTip.textContent = '录音需HTTPS，上传音频文件无需HTTPS';
      audioFileInput.value = '';  // 清空文件选择
    }

    // 开始录音
    async function startRecording() {
      if (isRecording) return;
      if (!checkRecorderSupport()) {
        recordStatus.textContent = '录音需要HTTPS';
        recordTip.textContent = '请点击📁上传音频文件（无需HTTPS）';
        return;
      }
      uploadedAudioFile = null;  // 清除上传的文件
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        // 选择兼容的 mimeType
        let mimeType = 'audio/webm;codecs=opus';
        if (!MediaRecorder.isTypeSupported(mimeType)) {
          mimeType = 'audio/webm';
        }
        if (!MediaRecorder.isTypeSupported(mimeType)) {
          mimeType = 'audio/mp4';
        }
        mediaRecorder = new MediaRecorder(stream, { mimeType });
        audioChunks = [];

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          // 停止所有音轨
          stream.getTracks().forEach(t => t.stop());
          audioBlob = new Blob(audioChunks, { type: mimeType.split(';')[0] });
          uploadedAudioFile = null;  // 清除上传的文件
          const url = URL.createObjectURL(audioBlob);
          previewAudio.src = url;
          previewArea.classList.add('show');
          recordStatus.textContent = '录音完成 ✓';
          recordTip.textContent = '点击 ✕ 可删除重录';
        };

        mediaRecorder.start();
        isRecording = true;
        btnRecord.classList.add('recording');
        recordStatus.innerHTML = '<span class="rec-dot"></span>录音中...';
        recSeconds = 0;
        recTimer = setInterval(() => {
          recSeconds++;
          recordStatus.innerHTML = '<span class="rec-dot"></span>' + recSeconds + 's';
          if (recSeconds >= MAX_REC_SECONDS) {
            stopRecording();
          }
        }, 1000);
      } catch (err) {
        console.error('录音失败:', err);
        if (err.name === 'NotAllowedError') {
          recordStatus.textContent = '请允许麦克风权限';
        } else {
          recordStatus.textContent = '录音启动失败';
        }
      }
    }

    // 停止录音
    function stopRecording() {
      if (!isRecording || !mediaRecorder) return;
      isRecording = false;
      btnRecord.classList.remove('recording');
      if (recTimer) { clearInterval(recTimer); recTimer = null; }
      if (mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
      }
    }

    // 删除录音
    function deleteRecording() {
      audioBlob = null;
      audioChunks = [];
      previewAudio.src = '';
      previewArea.classList.remove('show');
      recordStatus.textContent = '按住录音';
      recordTip.textContent = '';
    }

    // 按住录音（支持触摸和鼠标）
    btnRecord.addEventListener('mousedown', (e) => { e.preventDefault(); startRecording(); });
    btnRecord.addEventListener('mouseup', (e) => { e.preventDefault(); stopRecording(); });
    btnRecord.addEventListener('mouseleave', (e) => { if (isRecording) stopRecording(); });
    btnRecord.addEventListener('touchstart', (e) => { e.preventDefault(); startRecording(); }, { passive: false });
    btnRecord.addEventListener('touchend', (e) => { e.preventDefault(); stopRecording(); });
    btnRecord.addEventListener('touchcancel', (e) => { stopRecording(); });

    btnDelAudio.addEventListener('click', deleteRecording);

    // ========== 原有功能 ==========

    // 字数统计
    messageInput.addEventListener('input', () => {
      countSpan.textContent = messageInput.value.length;
    });

    // 祝福模板
    templates.addEventListener('click', (e) => {
      const btn = e.target.closest('.tpl-btn');
      if (!btn) return;
      messageInput.value = btn.textContent;
      countSpan.textContent = messageInput.value.length;
      messageInput.focus();
    });

    // 表情选择
    emojiPicker.addEventListener('click', (e) => {
      const opt = e.target.closest('.emoji-option');
      if (!opt) return;
      emojiPicker.querySelectorAll('.emoji-option').forEach(o => o.classList.remove('selected'));
      opt.classList.add('selected');
      selectedEmoji = opt.dataset.emoji;
    });

    // 颜色选择
    colorPicker.addEventListener('click', (e) => {
      const opt = e.target.closest('.color-option');
      if (!opt) return;
      colorPicker.querySelectorAll('.color-option').forEach(o => o.classList.remove('selected'));
      opt.classList.add('selected');
      selectedColor = opt.dataset.color;
    });

    // 提交（支持音频上传）
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const message = messageInput.value.trim();
      if (!message) return;

      submitBtn.querySelector('.btn-text').style.display = 'none';
      submitBtn.querySelector('.btn-loading').style.display = 'inline';
      submitBtn.disabled = true;

      try {
        let res;
        if (audioBlob || uploadedAudioFile) {
          // 有音频，用 FormData
          const fd = new FormData();
          fd.append('name', name);
          fd.append('message', message);
          fd.append('color', selectedColor);
          fd.append('emoji', selectedEmoji);
          fd.append('mbti_type', selectedMbti);
          const audioFile = uploadedAudioFile || audioBlob;
          const audioName = uploadedAudioFile ? uploadedAudioFile.name : 'voice.webm';
          fd.append('audio', audioFile, audioName);
          res = await fetch('/api/blessing', {
            method: 'POST',
            body: fd,
          });
        } else {
          // 无音频，用 JSON
          res = await fetch('/api/blessing', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, message, color: selectedColor, emoji: selectedEmoji, mbti_type: selectedMbti }),
          });
        }
        if (res.ok) {
          const result = await res.json();
          // 保存祝福 ID 到 localStorage，支持撤回
          if (result.blessing && result.blessing.id) {
            const myBlessings = JSON.parse(localStorage.getItem('myBlessings') || '[]');
            myBlessings.push(result.blessing.id);
            localStorage.setItem('myBlessings', JSON.stringify(myBlessings));
            lastBlessingId = result.blessing.id;
          }
          successOverlay.classList.add('show');
          startFireworks();  // 触发烟花特效
          startCountdown();
        } else {
          alert('发送失败，请重试');
        }
      } catch (err) {
        alert('网络错误，请重试');
      } finally {
        submitBtn.querySelector('.btn-text').style.display = 'inline';
        submitBtn.querySelector('.btn-loading').style.display = 'none';
        submitBtn.disabled = false;
      }
    });

    // 再送一条
    let redirectTimer = null;
    btnAgain.addEventListener('click', () => {
      cancelRedirect();
      successOverlay.classList.remove('show');
      messageInput.value = '';
      countSpan.textContent = '0';
      selectedEmoji = '';
      selectedMbti = '';
      document.getElementById('mbtiSelect').value = '';
      deleteRecording();
      emojiPicker.querySelectorAll('.emoji-option').forEach(o => o.classList.remove('selected'));
      emojiPicker.querySelector('.emoji-option').classList.add('selected');
      messageInput.focus();
    });

    // 查看弹幕墙
    btnView.addEventListener('click', () => {
      cancelRedirect();
      window.location.href = '/';
    });

    // 撤回祝福
    const btnWithdraw = document.getElementById('btnWithdraw');
    btnWithdraw.addEventListener('click', async () => {
      if (!lastBlessingId) {
        alert('无法找到祝福记录');
        return;
      }
      if (!confirm('确定要撤回这条祝福吗？')) return;
      
      btnWithdraw.disabled = true;
      btnWithdraw.textContent = '撤回中...';
      try {
        const res = await fetch('/api/blessing/' + lastBlessingId, { method: 'DELETE' });
        if (res.ok) {
          // 从 localStorage 中移除
          const myBlessings = JSON.parse(localStorage.getItem('myBlessings') || '[]');
          const idx = myBlessings.indexOf(lastBlessingId);
          if (idx > -1) myBlessings.splice(idx, 1);
          localStorage.setItem('myBlessings', JSON.stringify(myBlessings));
          
          alert('已撤回');
          successOverlay.classList.remove('show');
          messageInput.value = '';
          countSpan.textContent = '0';
          lastBlessingId = null;
        } else {
          alert('撤回失败，请重试');
        }
      } catch (e) {
        alert('网络错误');
      } finally {
        btnWithdraw.disabled = false;
        btnWithdraw.textContent = '撤回此祝福';
      }
    });

    // 自动跳转倒计时
    function startCountdown() {
      let sec = 3;
      countdownEl.textContent = sec;
      redirectHint.style.display = 'block';
      redirectTimer = setInterval(() => {
        sec--;
        countdownEl.textContent = sec;
        if (sec <= 0) {
          clearInterval(redirectTimer);
          window.location.href = '/';
        }
      }, 1000);
    }

    function cancelRedirect() {
      if (redirectTimer) {
        clearInterval(redirectTimer);
        redirectTimer = null;
      }
    }

    // 加载弹幕墙二维码
    async function loadDisplayQR() {
      try {
        const displayUrl = location.origin;
        document.getElementById('displayUrl').textContent = displayUrl;
        const res = await fetch('/api/qrcode?type=display');
        const data = await res.json();
        document.getElementById('qrImg').src = data.qr;
        // 点击跳转弹幕墙
        document.getElementById('displayLink').addEventListener('click', () => {
          window.location.href = '/';
        });
      } catch (e) {
        console.error('加载二维码失败:', e);
      }
    }
    loadDisplayQR();

    // 装饰粒子
    function createParticles() {
      const container = document.getElementById('particles');
      const emojis = ['🎈', '🎁', '🎂', '⭐', '🌟', '💖', '✨', '🎀'];
      for (let i = 0; i < 15; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        p.style.left = Math.random() * 100 + '%';
        p.style.animationDelay = Math.random() * 10 + 's';
        p.style.animationDuration = (8 + Math.random() * 12) + 's';
        p.style.fontSize = (16 + Math.random() * 20) + 'px';
        container.appendChild(p);
      }
    }
    createParticles();

    // ========== 烟花特效 ==========
    const fwCanvas = document.getElementById('fireworkCanvas');
    const fwCtx = fwCanvas.getContext('2d');
    let fwAnimId = null;
    let fwParticles = [];
    let fwRockets = [];
    let fwRunning = false;
    let fwLaunchTimer = null;

    const FW_COLORS = [
      ['#ff6b6b','#ee5a24','#ff9ff3'],
      ['#ffd93d','#ff9a9e','#fbc2eb'],
      ['#6bcb77','#4d96ff','#a18cd1'],
      ['#ff6348','#ffa502','#2ed573'],
      ['#70a1ff','#5352ed','#ff4757'],
      ['#eccc68','#ff6b81','#7bed9f'],
    ];

    function resizeFireworkCanvas() {
      fwCanvas.width = window.innerWidth;
      fwCanvas.height = window.innerHeight;
    }

    class FWParticle {
      constructor(x, y, color) {
        this.x = x; this.y = y;
        this.color = color;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 2;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.alpha = 1;
        this.decay = Math.random() * 0.015 + 0.012;
        this.size = Math.random() * 3 + 1.5;
        this.trail = [];
      }
      update() {
        this.trail.push({ x: this.x, y: this.y, alpha: this.alpha });
        if (this.trail.length > 6) this.trail.shift();
        this.vx *= 0.98;
        this.vy *= 0.98;
        this.vy += 0.06;  // 重力
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= this.decay;
      }
      draw(ctx) {
        // 拖尾
        for (let i = 0; i < this.trail.length; i++) {
          const t = this.trail[i];
          const a = t.alpha * (i / this.trail.length) * 0.4;
          ctx.beginPath();
          ctx.arc(t.x, t.y, this.size * 0.6, 0, Math.PI * 2);
          ctx.fillStyle = this.color.replace('1)', a + ')');
          ctx.fill();
        }
        // 主粒子
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = this.color.replace('1)', this.alpha + ')');
        ctx.fill();
        // 发光
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size * 2.5, 0, Math.PI * 2);
          ctx.fillStyle = this.color.replace('1)', this.alpha * 0.15 + ')');
        ctx.fill();
      }
    }

    class FWRocket {
      constructor() {
        this.x = Math.random() * fwCanvas.width * 0.8 + fwCanvas.width * 0.1;
        this.y = fwCanvas.height;
        this.targetY = Math.random() * fwCanvas.height * 0.4 + fwCanvas.height * 0.1;
        this.speed = Math.random() * 3 + 4;
        this.alpha = 1;
        this.colorSet = FW_COLORS[Math.floor(Math.random() * FW_COLORS.length)];
        this.trail = [];
        this.exploded = false;
      }
      update() {
        this.trail.push({ x: this.x, y: this.y });
        if (this.trail.length > 12) this.trail.shift();
        this.y -= this.speed;
        if (this.y <= this.targetY) {
          this.exploded = true;
          this.explode();
        }
      }
      explode() {
        const count = Math.floor(Math.random() * 40) + 50;
        for (let i = 0; i < count; i++) {
          const hex = this.colorSet[Math.floor(Math.random() * this.colorSet.length)];
          const r = parseInt(hex.slice(1,3), 16);
          const g = parseInt(hex.slice(3,5), 16);
          const b = parseInt(hex.slice(5,7), 16);
          const color = `rgba(${r},${g},${b},1)`;
          fwParticles.push(new FWParticle(this.x, this.y, color));
        }
      }
      draw(ctx) {
        // 火箭拖尾
        for (let i = 0; i < this.trail.length; i++) {
          const t = this.trail[i];
          const a = i / this.trail.length * 0.5;
          ctx.beginPath();
          ctx.arc(t.x, t.y, 2, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255,220,150,${a})`;
          ctx.fill();
        }
        // 火箭头
        ctx.beginPath();
        ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,240,200,1)';
        ctx.fill();
        // 发光
        ctx.beginPath();
        ctx.arc(this.x, this.y, 8, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,220,150,0.3)';
        ctx.fill();
      }
    }

    function fwAnimate() {
      fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);

      // 更新火箭
      fwRockets = fwRockets.filter(r => !r.exploded);
      fwRockets.forEach(r => { r.update(); r.draw(fwCtx); });

      // 更新粒子
      fwParticles = fwParticles.filter(p => p.alpha > 0.01);
      fwParticles.forEach(p => { p.update(); p.draw(fwCtx); });

      if (fwRunning || fwRockets.length > 0 || fwParticles.length > 0) {
        fwAnimId = requestAnimationFrame(fwAnimate);
      } else {
        fwCanvas.classList.remove('show');
      }
    }

    function launchRocket() {
      fwRockets.push(new FWRocket());
    }

    function startFireworks() {
      resizeFireworkCanvas();
      fwCanvas.classList.add('show');
      fwRunning = true;
      fwParticles = [];
      fwRockets = [];

      // 立即发射3个
      for (let i = 0; i < 3; i++) {
        setTimeout(() => launchRocket(), i * 200);
      }
      // 持续发射 3 秒
      let count = 0;
      fwLaunchTimer = setInterval(() => {
        launchRocket();
        if (Math.random() > 0.5) launchRocket();  // 随机双发
        count++;
        if (count >= 8) {  // 约 3 秒后停止发射
          clearInterval(fwLaunchTimer);
          fwLaunchTimer = null;
          fwRunning = false;
        }
      }, 350);

      if (fwAnimId) cancelAnimationFrame(fwAnimId);
      fwAnimate();
    }

    function stopFireworks() {
      fwRunning = false;
      if (fwLaunchTimer) { clearInterval(fwLaunchTimer); fwLaunchTimer = null; }
    }

    // 响应窗口大小变化
    window.addEventListener('resize', () => {
      if (fwCanvas.classList.contains('show')) resizeFireworkCanvas();
    });

    // ========== MBTI 快速测试 ==========
    const mbtiModal = document.getElementById('mbtiModal');
    const mbtiSelect = document.getElementById('mbtiSelect');
    const btnMbtiTest = document.getElementById('btnMbtiTest');
    const btnMbtiClose = document.getElementById('btnMbtiClose');
    const mbtiProgress = document.getElementById('mbtiProgress');
    const mbtiQuestion = document.getElementById('mbtiQuestion');
    const mbtiOptions = document.getElementById('mbtiOptions');
    const mbtiResult = document.getElementById('mbtiResult');
    const mbtiQuestionArea = document.getElementById('mbtiQuestionArea');
    const mbtiResultType = document.getElementById('mbtiResultType');
    const mbtiResultName = document.getElementById('mbtiResultName');
    const mbtiResultDesc = document.getElementById('mbtiResultDesc');
    const btnMbtiConfirm = document.getElementById('btnMbtiConfirm');

    const MBTI_QUESTIONS = [
      // E/I 维度
      { q: '周末到了，你更想？', a: '参加热闹的聚会', b: '宅在家享受独处', dim: 'EI' },
      { q: '和朋友聊天后，你通常？', a: '感觉能量满满', b: '需要独处恢复精力', dim: 'EI' },
      { q: '遇到新朋友时，你？', a: '主动搭话聊天', b: '等对方先开口', dim: 'EI' },
      // S/N 维度
      { q: '你更关注？', a: '眼前的事实和细节', b: '未来的可能和想象', dim: 'SN' },
      { q: '学习新东西时，你偏好？', a: '循序渐进，从实际例子开始', b: '先看全貌，自己摸索规律', dim: 'SN' },
      { q: '评价一个方案，你更看重？', a: '是否切实可行', b: '是否新颖独特', dim: 'SN' },
      // T/F 维度
      { q: '朋友向你诉苦，你会？', a: '帮Ta分析问题找方案', b: '先共情安慰，让Ta感觉被理解', dim: 'TF' },
      { q: '做重要决定时，你更依赖？', a: '逻辑分析和客观数据', b: '内心感受和价值观', dim: 'TF' },
      // J/P 维度
      { q: '你的旅行方式？', a: '提前做好详细攻略', b: '随性而走，走到哪算哪', dim: 'JP' },
      { q: '对待截止日期？', a: '提前完成，绝不拖延', b: 'DDL 前爆发超强战力', dim: 'JP' },
    ];

    const MBTI_DATA = {
      INTJ: { name: '建筑师', desc: '富有想象力的战略家，一切皆在计划中。独立果断，对知识有强烈的渴望。', color: '#9b59b6' },
      INTP: { name: '逻辑学家', desc: '不知疲倦的思考者，对知识和理论有无穷的好奇心。追求逻辑自洽，喜欢探索抽象概念。', color: '#9b59b6' },
      ENTJ: { name: '指挥官', desc: '大胆果断的天生领袖，善于制定长远计划并推动团队执行。气场强大，目标明确。', color: '#9b59b6' },
      ENTP: { name: '辩论家', desc: '聪明好奇的思想实验者，热爱智力挑战和头脑风暴。思维敏捷，喜欢打破常规。', color: '#9b59b6' },
      INFJ: { name: '提侣者', desc: '安静而神秘的理想主义者，洞察力强，总是思考如何让世界更美好。', color: '#27ae60' },
      INFP: { name: '调停者', desc: '诗意善良的利他主义者，内心丰富且充满理想。对世界有独特的理解和深沉的共情。', color: '#27ae60' },
      ENFJ: { name: '主人公', desc: '富有魅力的激励者，天生的影响力让周围人愿意追随。善于鼓舞人心，推动改变。', color: '#27ae60' },
      ENFP: { name: '竞选者', desc: '热情洋溢的自由精灵，永远充满创意和可能性。好奇心旺盛，感染力十足。', color: '#27ae60' },
      ISTJ: { name: '物流师', desc: '务实可靠的秩序守护者，一丝不苟地履行职责。重视传统，值得信赖。', color: '#3498db' },
      ISFJ: { name: '守卫者', desc: '温暖体贴的保护者，默默守护身边的人。细心周到，是团队中不可或缺的支柱。', color: '#3498db' },
      ESTJ: { name: '总经理', desc: '高效务实的组织者，善于建立秩序和制度。做事有计划，执行力超强。', color: '#3498db' },
      ESFJ: { name: '执行者', desc: '热心肠的社交家，总是把别人的需求放在心上。善于营造温馨和谐的团队氛围。', color: '#3498db' },
      ISTP: { name: '鉴赏家', desc: '大胆实际的实验家，喜欢动手探索世界。冷静理性，擅长在紧急时刻解决问题。', color: '#f39c12' },
      ISFP: { name: '探险家', desc: '灵活随性的艺术家，用行动和美感诠释世界。内心丰富但低调，活在当下。', color: '#f39c12' },
      ESTP: { name: '企业家', desc: '活力满满的机会主义者，享受冒险和即兴发挥。反应极快，永远走在最前沿。', color: '#f39c12' },
      ESFP: { name: '表演者', desc: '自发的娱乐家，天生自带光环。热情洋溢，走到哪里都是派对的中心。', color: '#f39c12' },
    };

    let mbtiAnswers = {};
    let mbtiCurrentQ = 0;

    // 打开测试弹窗
    btnMbtiTest.addEventListener('click', () => {
      mbtiAnswers = {};
      mbtiCurrentQ = 0;
      mbtiQuestionArea.style.display = '';
      mbtiResult.style.display = 'none';
      document.getElementById('mbtiModalTitle').textContent = '快速 MBTI 测试';
      document.getElementById('mbtiModalSubtitle').textContent = '10 道题，1 分钟搞定';
      // 生成进度点
      mbtiProgress.innerHTML = MBTI_QUESTIONS.map((_, i) =>
        `<div class="mbti-progress-dot${i === 0 ? ' active' : ''}" id="mbtiDot${i}"></div>`
      ).join('');
      renderQuestion(0);
      mbtiModal.classList.add('show');
    });

    // 关闭弹窗
    btnMbtiClose.addEventListener('click', () => mbtiModal.classList.remove('show'));
    mbtiModal.addEventListener('click', (e) => {
      if (e.target === mbtiModal) mbtiModal.classList.remove('show');
    });

    function renderQuestion(idx) {
      const q = MBTI_QUESTIONS[idx];
      mbtiQuestion.textContent = `${idx + 1}. ${q.q}`;
      mbtiOptions.innerHTML = `
        <div class="mbti-option" data-val="A">A. ${q.a}</div>
        <div class="mbti-option" data-val="B">B. ${q.b}</div>
      `;
      // 高亮已选
      if (mbtiAnswers[q.dim + idx]) {
        mbtiOptions.querySelectorAll('.mbti-option').forEach(o => {
          if (o.dataset.val === mbtiAnswers[q.dim + idx]) o.classList.add('selected');
        });
      }
      mbtiOptions.querySelectorAll('.mbti-option').forEach(o => {
        o.addEventListener('click', () => selectAnswer(idx, o.dataset.val));
      });
    }

    function selectAnswer(idx, val) {
      const q = MBTI_QUESTIONS[idx];
      mbtiAnswers[q.dim + idx] = val;
      // 更新进度点
      const dot = document.getElementById('mbtiDot' + idx);
      dot.classList.remove('active');
      dot.classList.add('done');
      // 下一题或出结果
      if (idx < MBTI_QUESTIONS.length - 1) {
        const nextDot = document.getElementById('mbtiDot' + (idx + 1));
        nextDot.classList.add('active');
        mbtiCurrentQ = idx + 1;
        setTimeout(() => renderQuestion(idx + 1), 300);
      } else {
        setTimeout(showMbtiResult, 400);
      }
    }

    function showMbtiResult() {
      // 计算各维度
      let scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
      MBTI_QUESTIONS.forEach((q, i) => {
        const ans = mbtiAnswers[q.dim + i];
        if (!ans) return;
        const dimMap = { EI: ['E', 'I'], SN: ['S', 'N'], TF: ['T', 'F'], JP: ['J', 'P'] };
        const [aKey, bKey] = dimMap[q.dim];
        if (ans === 'A') scores[aKey]++;
        else scores[bKey]++;
      });
      const type = (scores.E >= scores.I ? 'E' : 'I')
                 + (scores.S >= scores.N ? 'S' : 'N')
                 + (scores.T >= scores.F ? 'T' : 'F')
                 + (scores.J >= scores.P ? 'J' : 'P');

      const info = MBTI_DATA[type];
      mbtiQuestionArea.style.display = 'none';
      mbtiResult.style.display = '';
      mbtiResultType.textContent = type;
      mbtiResultType.className = 'mbti-result-type ' + type;
      mbtiResultName.textContent = info.name;
      mbtiResultDesc.textContent = info.desc;
      document.getElementById('mbtiModalTitle').textContent = '你的性格类型';
      document.getElementById('mbtiModalSubtitle').textContent = '';
      mbtiProgress.innerHTML = MBTI_QUESTIONS.map(() =>
        '<div class="mbti-progress-dot done"></div>'
      ).join('');

      // 保存结果到变量
      selectedMbti = type;
    }

    // 确认 MBTI 结果
    btnMbtiConfirm.addEventListener('click', () => {
      mbtiSelect.value = selectedMbti;
      mbtiModal.classList.remove('show');
    });

    // 下拉选择也同步
    mbtiSelect.addEventListener('change', () => {
      selectedMbti = mbtiSelect.value;
    });
  </script>
